<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Material Calculator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Material Calculator</h1>
        <p>คำนวณรายการวัสดุจาก BaseData และแตกชุด SET เป็นรายการย่อย</p>
      </div>
      <div class="status" id="status">พร้อมใช้งาน</div>
    </header>

    <nav class="app-tabs" aria-label="เมนูหลัก">
      <button class="app-tab active" data-tab="calculator" type="button"><span class="tab-icon">⌁</span> คำนวณงาน</button>
      <button class="app-tab" data-tab="saved" type="button"><span class="tab-icon">▣</span> งานที่บันทึก <span id="savedCount" class="tab-count">0</span></button>
    </nav>

    <section class="project-bar tab-panel" data-panel="calculator">
      <div class="project-fields">
        <label>
          <span>ชื่องาน</span>
          <input id="projectName" type="text" placeholder="เช่น งานปรับปรุงระบบจำหน่าย">
        </label>
        <label>
          <span>เลขผัง</span>
          <input id="planNumber" type="text" placeholder="เช่น KAN5(P1)FIN">
        </label>
      </div>
      <div class="project-actions">
        <span id="saveHint">ยังไม่ได้บันทึกงานนี้</span>
        <button id="newProject" type="button">สร้างงานใหม่</button>
        <button id="saveProject" class="primary" type="button">บันทึกงาน</button>
      </div>
    </section>

    <section class="saved-projects tab-panel" data-panel="saved" hidden>
      <div class="saved-head">
        <div>
          <h2>งานที่บันทึกไว้</h2>
          <p id="savedLocationText">ข้อมูลเก็บอยู่ในเบราว์เซอร์เครื่องนี้</p>
        </div>
        <div class="cloud-auth">
          <div id="googleSignIn"></div>
          <div id="cloudUser" class="cloud-user" hidden>
            <span id="cloudUserName"></span>
            <button id="googleSignOut" type="button">ออกจากระบบ</button>
          </div>
        </div>
      </div>
      <div id="cloudNotice" class="cloud-notice" hidden></div>
      <div id="savedProjectList" class="saved-list"></div>
    </section>

    <section class="workspace tab-panel" data-panel="calculator">
      <div class="controls">
        <div class="control-group">
          <label>จำนวนหน้า</label>
          <input id="totalPages" type="number" min="1" value="1">
          <button id="applyPages" type="button">กำหนด</button>
        </div>
        <div class="control-group">
          <button id="prevPage" type="button">ก่อนหน้า</button>
          <span id="pageLabel">หน้า 1/1</span>
          <button id="nextPage" type="button">ถัดไป</button>
        </div>
        <div class="control-group grow">
          <button id="addRow" type="button">เพิ่มแถว</button>
          <button id="removeRow" type="button">ลบแถว</button>
          <button id="clearPage" type="button">ล้างหน้านี้</button>
        </div>
      </div>

      <div class="page-picker" id="pagePicker" aria-label="เลือกหน้า"></div>

      <div class="input-table-wrap">
        <table class="input-table">
          <thead>
            <tr>
              <th>ขนาดเสา (m)</th>
              <th>รหัสหัวเสา</th>
              <th>จำนวน</th>
            </tr>
          </thead>
          <tbody id="inputRows"></tbody>
        </table>
      </div>

      <div class="actions">
        <button id="calculate" class="primary" type="button">คำนวณ</button>
        <button id="expandSet" type="button">แตก SET</button>
        <button id="exportExcel" type="button">Export Excel</button>
        <button id="exportPages" type="button">Export รายการแต่ละหน้า</button>
      </div>
    </section>

    <section class="results tab-panel" data-panel="calculator">
      <div class="result-head">
        <h2>ผลลัพธ์</h2>
        <span id="resultMeta">ยังไม่มีข้อมูล</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>รายการวัสดุ</th>
              <th>รหัสพัสดุ</th>
              <th>จำนวนรวม</th>
            </tr>
          </thead>
          <tbody id="resultRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/static/app.js"></script>
</body>
</html>
